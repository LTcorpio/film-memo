# film-memo 部署
# compose 仅负责运行，镜像由单独的构建流程生成 film-memo:latest（见 Dockerfile）。
#
# 凭证注入：docker compose 默认读取同目录 .env，经 ${TMDB_ACCESS_TOKEN:-} /
# ${TMDB_API_KEY:-} 注入为环境变量，应用通过 os.Getenv 读取。
# 请确保项目根目录 .env 已填写 TMDB 凭证（二选一即可）。
#
# CA 证书：运行时镜像已在 Dockerfile 安装 ca-certificates，修复容器内
# TMDB HTTPS 失败（x509）。若此前已构建过镜像，需重新 build 后才生效。
#
# 数据持久化：宿主 OneDrive 目录挂载到容器 /app/data（db 与 images 分开挂载）。
# restart: "no"：按需手动 docker compose up，停止后不自动重启。

services:
  film-memo:
    image: film-memo:latest
    container_name: film-memo
    ports:
      - "8686:8686"
    # 只在需要时启动：容器停止后不会自动重启，需手动 docker compose up
    restart: "no"
    volumes:
      # 数据库
      - /Users/ltcorpio/Library/CloudStorage/OneDrive-Personal/DockerData/film-memo/db:/app/data/db
      # TMDB 海报/背景图
      - /Users/ltcorpio/Library/CloudStorage/OneDrive-Personal/DockerData/film-memo/images:/app/data/images
    environment:
      - NODE_ENV=production
      - PORT=8686
      # 数据库文件路径指向挂载目录
      - DB_PATH=/app/data/db/films.db
      # 图片目录（与上方挂载一致）
      - IMAGES_DIR=/app/data/images
      # TMDB 凭证从 .env 自动注入（docker compose 默认读取同目录 .env）
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
